[project]
name = "bausatz"
version = "0.3.0"
description = "Config-driven component trees: pydantic-validated classes that self-register by tag and assemble recursively from plain dict/JSON specs"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Matthias Denecke" }]
keywords = ["components", "factory", "registry", "pydantic", "config-driven", "plugins", "composition", "discriminated-union"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
    "Operating System :: OS Independent",
]
dependencies = ["pydantic>=2.7"]  # 2.7: model_dump(serialize_as_any=...), used by to_dict()

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff"]

[project.urls]
Homepage = "https://github.com/MatthiasDenecke/bausatz"
Repository = "https://github.com/MatthiasDenecke/bausatz"
Changelog = "https://github.com/MatthiasDenecke/bausatz/blob/HEAD/CHANGELOG.md"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bausatz = ["py.typed", "inc/bausatz/*.hpp"]  # inc/ is copied into the package at build (see setup.py)

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# Pin the rule set so the CI lint and any local ruff agree regardless of ruff's version — its
# defaults have shifted over releases (0.16 added isort `I` and pyupgrade `UP`), which otherwise
# makes a check pass locally but fail in CI.
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
