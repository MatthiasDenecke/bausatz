name: Validate branch name

on:
  pull_request:
    branches:
      - '*'
  push:
    branches-ignore:
      - main
      - develop

# The check reads nothing from the repository, so the job gets no token permissions at all.
permissions: {}

jobs:
  validate_branch-name:
    runs-on: ubuntu-latest

    steps:
    - name: Validate Branch Name
      env:
        # Passed through the environment, never interpolated into the script: a branch name is
        # attacker-controlled (anyone can open a PR from a fork), and ${{ }} is expanded into the
        # script text before bash parses it, so a crafted name would run as shell code.
        BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
      run: |
        if [[ "$BRANCH_NAME" == "main" || "$BRANCH_NAME" == "develop" || "$BRANCH_NAME" =~ ^feature\/.* || "$BRANCH_NAME" =~ ^refactor\/.* || "$BRANCH_NAME" =~ ^bugfix\/.* || "$BRANCH_NAME" =~ ^release\/.* ]]; then
          echo "Branch name '$BRANCH_NAME' is valid."
        else
          echo "Error: Branch name '$BRANCH_NAME' does not follow conventions."
          echo "Branch names must start with 'feature/', 'refactor/', or 'bugfix/', or be 'main' or 'develop'."
          exit 1
        fi
