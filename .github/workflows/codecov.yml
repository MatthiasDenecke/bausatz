name: Run tests and upload coverage

# push: every branch, which keeps the badge and the coverage baseline for main/develop current.
# pull_request: also tests PRs from forks (a push to a fork doesn't trigger this repo's workflows),
# and tests the merge result with the base branch rather than just the branch head.
on: [push, pull_request]

jobs:
  test:
    name: Run tests and collect coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install
        run: pip install -e .[dev]

      - name: Lint
        run: ruff check src tests

      - name: Run tests
        run: pytest --cov=bausatz --cov-branch --cov-report=xml

      - name: Upload results to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
